; ---------------------------------------------------------------------
; Market Big Picture Watch -- configuration
;
; Edit this file and restart the server. It is read automatically on both
; Windows and Linux; there is nothing to set in the environment and nothing
; to install. Lines starting with ; or # are comments.
;
; THIS FILE WINS. A value set here beats an environment variable of the same
; name (MW_FRED_API_KEY, MW_PORT, ...) -- deliberately, so that what you can
; see in this file is what the app uses, and a stale variable left in a shell
; profile or in Windows user variables cannot silently override it.
; Environment variables still fill in anything left EMPTY here.
; `python run.py doctor` prints where each value actually came from, and flags
; any setting where both exist.
; ---------------------------------------------------------------------

[marketwatch]

; FRED API key -- the one setting worth filling in.
; Without it the app falls back to an unauthenticated scrape of
; fredgraph.csv, which is throttled per IP and is the usual cause of read
; timeouts partway through a long update. A key is free and takes a minute:
;     https://fredaccount.stlouisfed.org/apikey
; Paste it after the = with no quotes. Nothing else to set up: no
; environment variable, no shell profile, same on Windows and Linux.
fred_api_key = 40652c147c5c1cb8ea6cba9c9b47dad1

; Automatic updates run inside the server process. Leave this at 1 and there
; is nothing else to set up -- no cron job, no Windows Task Scheduler entry.
; Set to 0 only if you want to drive `python run.py update` yourself.
enable_scheduler = 1

; Times of day (local, 24-hour) for the automatic data update. Two runs:
; early morning for the overnight data, and evening so the after-work view
; already includes the day's close. The server does this itself -- no cron
; job, no Task Scheduler entry. Comma separated; any number of hours.
update_hours = 6,19

; Timezone those hours are interpreted in. Leave EMPTY to use the machine's
; own local time (the historical behaviour).
;
; Worth setting when you run this on more than one machine. A Linux server is
; normally on UTC while a desktop is on local time, so the same config fires
; hours apart -- 06:20 UTC on one box and 06:20 America/Chicago on the other.
; Naming a zone here makes both fire at the same real moment whatever the host
; clocks say. Any IANA name: America/Chicago, Europe/London, Asia/Shanghai.
update_timezone =

; Minute past the hour for those runs. Kept away from :00 because that is
; when every other scheduled job on a machine tends to fire.
update_minute = 20

; Run a catch-up update at startup if the cached data is older than this many
; hours. This is what covers a laptop that was asleep, or a server that was
; down, at the scheduled time. 0 disables it.
startup_catchup_hours = 18

; Where the server listens.
;   auto      bind IPv6 when this machine has it, IPv4 when it does not
;   0.0.0.0   IPv4 only -- an IPv6 browser gets "connection refused", which
;             looks exactly like the server not running
;   ::        IPv6 only. NOT dual-stack: asyncio forces IPV6_V6ONLY on, so
;             IPv4 clients are refused. Use 0.0.0.0 if you need them.
;   127.0.0.1 this machine only (right when a tunnel or proxy fronts it)
;
; So `auto` on an IPv6-capable box means http://127.0.0.1:8000 will NOT work
; -- use http://[::1]:8000. See docs/Server_runbook.md section 3.2.
host = auto

; The port. Remember it when typing an IPv6 URL: the address itself ends in a
; hextet that looks like a port, so http://[....:8280] is really port 80.
; You need  http://[....:8280]:8000/  -- brackets round the address, port after.
port = 8000

; Set a token to enable the manual-refresh endpoint:
;     POST /api/update  with header  X-Admin-Token: <token>
; Empty (the default) disables that endpoint entirely.
admin_token =

; Build the second set of backtests with the volatility brake OFF, so the
; dashboard's brake checkbox has something to show. This doubles the strategy
; work (3 sleeves x 6 fractions x 2 = 36 backtests, roughly 7-12 minutes).
; Set to 0 to halve the update time; the checkbox then hides itself.
strategy_vt_ab = 1

; Where the cache lives. Relative paths are relative to the project folder.
; Back this one folder up and everything else can be rebuilt from the zip.
data_dir = data
